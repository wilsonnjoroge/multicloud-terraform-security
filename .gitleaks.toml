title = "Project Gitleaks Config"

[extend]
useDefault = true


[[rules]]
id = "database-url"
description = "Detect database connection strings containing credentials"
regex = '''(?i)(postgres|postgresql|mysql|mongodb(?:\+srv)?):\/\/[^:\/\s]+:[^@\/\s]+@'''
keywords = [
  "postgres://",
  "postgresql://",
  "mysql://",
  "mongodb://",
  "mongodb+srv://",
]


[allowlist]
paths = [
  '''\.terraform/.*''',
  '''tests/fixtures/.*''',
  '''^\.env\.example$''',
]

regexes = [
  '''example-key-[0-9]+''',
]